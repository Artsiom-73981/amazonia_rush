name: AmazoniaRush
options:
  bundleIdPrefix: com.amazora
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: L996K7LXCP
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    ENABLE_BITCODE: NO

targets:
  AmazoniaRush:
    type: application
    platform: iOS
    info:
      path: App/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Amazonia Rush
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [armv7]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen:
          UIColorName: BootWash
          UIImageRespectsSafeAreaInsets: false
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    sources:
      - path: App/Source
      - path: App/Generated
      - path: App/Media.xcassets
      - path: App/Audio
        buildPhase: resources
      - path: App/Supporting/VerdantOracle.h
        buildPhase: none
      - path: App/Supporting/Bridge.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amazora.marketgame
        PRODUCT_NAME: Amazonia Rush
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/Supporting/Bridge.h
        OTHER_LDFLAGS: -lverdant_oracle
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        DEAD_CODE_STRIPPING: YES
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/Vendor/device
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/Vendor/sim
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
