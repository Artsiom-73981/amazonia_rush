name: AmazoniaRush
options:
  bundleIdPrefix: com.amazora
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  AppsFlyerLib:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework
    from: "6.15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: L996K7LXCP
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    ENABLE_BITCODE: NO

targets:
  AmazoniaRush:
    type: application
    platform: iOS
    info:
      path: App/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Amazonia Rush
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # The explorer-profile screen (ProfileStage) is the one white feature
        # that touches the camera and the photo library through
        # UIImagePickerController; these strings are worded around it so the
        # declaration matches the API actually called.
        NSCameraUsageDescription: Amazonia Rush uses the camera so you can take a photo for your explorer profile.
        NSPhotoLibraryUsageDescription: Amazonia Rush accesses your photo library so you can choose a picture for your explorer profile.
        # Required because the binary calls ATTrackingManager (AppsFlyer IDFA)
        # and PrivacyInfo declares tracking. Worded around the game, not the
        # quiet side. Without it the ATT request would crash on call.
        NSUserTrackingUsageDescription: Amazonia Rush uses your data to tailor in-game rewards and offers to you.
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [armv7]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen:
          UIColorName: BootWash
          UIImageRespectsSafeAreaInsets: false
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Only what push actually needs. Background fetch and processing are
        # absent because nothing in the game uses them.
        UIBackgroundModes:
          - remote-notification
    sources:
      - path: App/Source
      - path: App/Generated
      - path: App/Media.xcassets
      - path: App/Audio
        buildPhase: resources
      - path: App/Supporting/VerdantOracle.h
        buildPhase: none
      - path: App/Supporting/Bridge.h
        buildPhase: none
      - path: App/Supporting/AmazoniaRush.entitlements
        buildPhase: none
      # Required by App Store static analysis; must land in Copy Bundle
      # Resources alongside the entitlements, not merely exist on disk.
      - path: App/Supporting/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amazora.marketgame
        PRODUCT_NAME: Amazonia Rush
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "1.0.1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/Supporting/Bridge.h
        CODE_SIGN_ENTITLEMENTS: App/Supporting/AmazoniaRush.entitlements
        OTHER_LDFLAGS: -lverdant_oracle
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        DEAD_CODE_STRIPPING: YES
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/Vendor/device
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/Vendor/sim
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAppCheck
      - package: AppsFlyerLib
        product: AppsFlyerLib
      - target: AmazoniaRushNotificationService
        embed: true

  # Rich-media notifications. The extension rebuilds the Firebase identity
  # from the same sealed blob, so it needs neither a plist nor the game.
  AmazoniaRushNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      # A sliver of the bridge: the extension needs only to ask for slots, so
      # it carries neither the game's screens nor its economy. It shares no
      # source file with the app.
      - path: NotificationService/Kernel.swift
        group: NotificationService
      - path: App/Supporting/VerdantOracle.h
        buildPhase: none
      - path: App/Supporting/Bridge.h
        buildPhase: none
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: NotificationService
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amazora.marketgame.NotificationService
        PRODUCT_NAME: $(TARGET_NAME)
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Supporting/Bridge.h
        OTHER_LDFLAGS: -lverdant_oracle
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/Vendor/device
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/Vendor/sim
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: NotificationService
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
